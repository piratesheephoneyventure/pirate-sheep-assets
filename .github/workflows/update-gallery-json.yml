name: Update gallery JSON

on:
  push:
    branches: [main]
    paths:
      - '*/images/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: node scripts/generate-thumbnails.js

      - run: node scripts/update-gallery-json.js

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '*/images.json' '*/thumbnails'
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync gallery images.json and thumbnails"
            git push
          fi
