name: Update gallery JSON

on:
  push:
    branches: [main]
    paths:
      - '*/images/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - run: node scripts/update-gallery-json.js

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '*/images.json'
          git diff --cached --quiet || git commit -m "chore: sync gallery images.json"
          git diff --cached --quiet || git push
